<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <div class="container-fluid py-4">
        <div class="d-flex flex-column toon-playground-container">

            <div class="mb-4 d-flex justify-content-between align-items-end">
                <div>
                    <h1 class="display-6 fw-bold text-primary mb-1">
                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.title"/>
                    </h1>
                    <p class="text-muted mb-0">
                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.subtitle"/>
                    </p>
                </div>
                <button type="button" class="btn btn-danger btn-sm" id="toon-clear-btn" data-confirm-message="{f:translate(key:'LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.clear_confirm')}">
                    <core:icon identifier="actions-delete" size="small" />
                    <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.clear_all"/>
                </button>
            </div>

            <f:if condition="{error}">
                <div class="alert alert-danger shadow-sm mb-4 border-start border-4 border-danger" role="alert">
                    <div class="d-flex align-items-center">
                        <core:icon identifier="actions-exclamation" size="small" />
                        <div>{error}</div>
                    </div>
                </div>
            </f:if>

            <form method="post" action="" id="toon-form" class="flex-grow-1">
                <div class="card shadow-sm border-0 mb-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="row g-0">

                            <div class="col-12 col-lg-5 p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label for="toon-input" class="form-label fw-bold text-uppercase small text-muted mb-0">
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.input_label"/>
                                    </label>
                                    <span class="badge toon-playground-badge-soft text-muted fw-normal">
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.badge_input"/>
                                    </span>
                                </div>
                                <textarea class="form-control toon-playground-monospace border-0 bg-light p-3 toon-playground-editor"
                                          id="toon-input" name="input"
                                          placeholder="{f:translate(key:'LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.placeholder')}">{input}</textarea>
                            </div>

                            <div class="col-12 col-lg-2 d-flex flex-column align-items-center justify-content-center bg-white border-start border-end py-5 px-3">
                                <div class="d-grid gap-3 w-100 toon-playground-controls">
                                    <button type="submit" name="mode" value="encode" class="btn btn-primary btn-lg shadow-sm py-3">
                                        <strong><f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.encode"/></strong>
                                        <core:icon identifier="actions-arrow-right-alt" size="small" />
                                    </button>

                                    <button type="submit" name="mode" value="compact" class="btn btn-secondary btn-sm">
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.encode_compact"/>
                                    </button>

                                    <div class="toon-playground-hr-text text-muted my-3 small text-uppercase fw-bold">
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.or"/>
                                    </div>

                                    <button type="submit" name="mode" value="decode" class="btn btn-dark btn-lg shadow-sm py-3">
                                        <core:icon identifier="actions-arrow-left-alt" size="small" />
                                        <strong><f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.decode"/></strong>
                                    </button>

                                    <f:if condition="{tokenEstimate}">
                                        <div class="mt-4 p-2 bg-info bg-opacity-10 border border-info border-opacity-25 rounded text-center">
                                            <div class="text-info small fw-bold">
                                                <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.estimated_tokens_label"/>
                                            </div>
                                            <div class="h4 mb-0 text-info">{tokenEstimate}</div>
                                        </div>
                                    </f:if>
                                </div>
                            </div>

                            <div class="col-12 col-lg-5 p-4 bg-light">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label for="toon-output" class="form-label fw-bold text-uppercase small text-muted mb-0">
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.output_label"/>
                                    </label>
                                    <button type="button" class="btn btn-sm btn-success px-3" id="copy-btn">
                                        <core:icon identifier="actions-clipboard" size="small" />
                                        <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.copy"/>
                                    </button>
                                </div>
                                <textarea class="form-control toon-playground-monospace border-0 p-3 toon-playground-shadow-inner toon-playground-editor"
                                          id="toon-output" name="output"
                                          readonly>{output}</textarea>
                                <div id="copy-status" class="text-success small mt-2 opacity-0 toon-playground-transition">
                                    <core:icon identifier="actions-check-circle" size="small" />
                                    <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.copied_to_clipboard"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <footer class="mt-auto pt-4 pb-3 border-top d-flex justify-content-between align-items-center text-muted small">
                <div>
                    <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.footer_made_with"/>
                </div>
                <div class="d-flex align-items-center">
                    <a href="https://github.com/therohanparmar/t3-toon" target="_blank" rel="noopener" class="text-muted text-decoration-none me-3 toon-playground-link">
                        <core:icon identifier="actions-brand-github" size="small" /> <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.github"/>
                    </a>
                    <span class="text-muted me-3">|</span>
                    <a href="https://docs.typo3.org/p/rrp/t3-toon/main/en-us/" target="_blank" rel="noopener" class="text-muted text-decoration-none toon-playground-link">
                        <core:icon identifier="actions-notebook-typoscript" size="small" /> <f:translate key="LLL:EXT:rrp_t3toon/Resources/Private/Language/locallang_mod.xlf:playground.documentation"/>
                    </a>
                </div>
            </footer>
        </div>
    </div>
</f:section>
</html>
