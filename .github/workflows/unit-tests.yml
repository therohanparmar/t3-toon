name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: TYPO3 ${{ matrix.typo3 }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TYPO3 v11
          - typo3: "^11.5"
            php: "7.4"
          - typo3: "^11.5"
            php: "8.0"
          - typo3: "^11.5"
            php: "8.1"
          
          # TYPO3 v12
          - typo3: "^12.4"
            php: "8.1"
          - typo3: "^12.4"
            php: "8.2"
          - typo3: "^12.4"
            php: "8.3"
          
          # TYPO3 v13
          - typo3: "^13.4"
            php: "8.2"
          - typo3: "^13.4"
            php: "8.3"
          
          # TYPO3 v14
          - typo3: "^14.0"
            php: "8.2"
          - typo3: "^14.0"
            php: "8.3"
          - typo3: "^14.0"
            php: "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, pdo, sqlite3
          tools: composer

      - name: Fix PHPUnit Configuration Path
        # Adjusts the bootstrap path from monorepo style (../../vendor) to standalone package style (vendor)
        run: sed -i 's|../../vendor|vendor|g' phpunit.xml.dist

      - name: Install TYPO3 Version
        run: composer require typo3/cms-core:"${{ matrix.typo3 }}" --no-update

      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit -c phpunit.xml.dist
