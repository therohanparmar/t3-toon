name: core 11

on: [ push, pull_request ]

jobs:
  tests:
    name: v11 - PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, pdo, sqlite3
          tools: composer

      - name: Install TYPO3 v11
        run: composer require typo3/cms-core:"^11.5" --no-update

      - name: Fix PHPUnit Configuration Path
        run: sed -i 's|../../vendor|vendor|g' phpunit.xml.dist

      - name: Composer Install
        run: composer update --prefer-dist --no-progress

      - name: Unit Tests
        run: vendor/bin/phpunit -c phpunit.xml.dist